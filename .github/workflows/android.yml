name: Build Android APK

on:
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Obfuscate web code
        run: node obfuscate.js

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Preparar keystore de firma
        env:
          KEYSTORE_B64: ${{ secrets.ARTEFGO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/artefgo.keystore
            echo "Keystore de firma lista (firma estable)."
          else
            echo "::warning::Sin secreto ARTEFGO_KEYSTORE_B64; se usa firma debug por defecto (cambiará en cada build)."
          fi

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ARTEFGO_KEYSTORE: ${{ github.workspace }}/android/keystore/artefgo.keystore
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace && break
            echo "::warning::Intento $i falló (posible 429 de Maven). Reintentando en 40s..."
            sleep 40
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArtefGo-Frames-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Releases (link directo)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: APK de prueba (último)
          body: "APK debug generado automáticamente desde main. Instálalo activando 'orígenes desconocidos'."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
